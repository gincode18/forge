[project]
name = "forge-api"
version = "0.1.0"
description = "Local FastAPI service for the Forge agent runtime"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
forge-api = "forge.api.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
