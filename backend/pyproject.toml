[project]
name = "forge-api"
version = "0.1.0"
description = "Local FastAPI service for the Forge agent runtime"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
